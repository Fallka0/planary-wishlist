# Deploys wishlist.planary.ch (one Worker: the web app and the API) whenever main changes.
# Needs the repository secret CLOUDFLARE_API_TOKEN with Workers Scripts, Workers Routes and D1 edit
# rights. CLOUDFLARE_ACCOUNT_ID is optional; set it if the token can see more than one account.
# Migrations run before the new code goes live, so a schema change ships with the code that needs it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - name: Create the database on the first deploy
        working-directory: worker
        run: npx wrangler d1 info planary-wishlist > /dev/null || npx wrangler d1 create planary-wishlist
      - run: npm run db:migrate
        working-directory: worker
      - run: npm run deploy
        working-directory: worker
