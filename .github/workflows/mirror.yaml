name: Mirror to Org
on:
  push:
    branches: ["**"]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          # Every branch and tag, not --mirror: from a non-main push --mirror tried to delete main on
          # the mirror and failed. Branches deleted here are no longer deleted there.
          git remote set-head origin -d || true
          git push "https://x-access-token:${{ secrets.ORG_MIRROR_TOKEN }}@github.com/Planary/planary-wishlist.git" \
            "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
