<title>Planary Wishlist · Empty wishlist (static reference)</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Unbounded:wght@300;400&amp;display=swap">
<style>
body{margin:0;background:#0b0b0f}
.pl *,.pl *::before,.pl *::after{box-sizing:border-box}
.pl{--paper:#f5f5f7;--card:#ececf0;--card-h:#e3e3e9;--raise:#ffffff;--ink:#0b0b0f;--t2:#55555e;--rule:#d4d4db;--rule-s:#a9a9b3;--fb:transparent;--btn:#1f1b3a;--btn-h:#2d2852;--btn-fg:#f5f5f7;--violet:#8b5cf6;--ok:#1d6b45;--ok-bg:#e1f0e7;--err:#9b1c2e;--err-bg:#f8e6e9;--tile1:#ffffff;--tile2:#eeeef2;--tile3:#dcdce3;--tile-i:#26262d;--scrim:rgba(11,11,15,.42);--shadow:0 30px 80px rgba(11,11,15,.24),0 2px 8px rgba(11,11,15,.08);--ease:cubic-bezier(.22,1,.36,1);--disp:"Unbounded","Archivo",ui-sans-serif,sans-serif;--body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b0b0f;padding:14px;min-height:100vh;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.pl.dark{--paper:#131317;--card:#1e1e24;--card-h:#26262d;--raise:#1a1a1f;--ink:#f1f1f4;--t2:#a3a3ad;--rule:#2c2c34;--rule-s:#4a4a54;--fb:#2c2c34;--btn:#f1f1f4;--btn-h:#ffffff;--btn-fg:#0b0b0f;--ok:#8fd8ae;--ok-bg:#15301f;--err:#f3a3b0;--err-bg:#3a1820;--tile1:#34343c;--tile2:#202027;--tile3:#141418;--tile-i:#e9e9ee;--scrim:rgba(0,0,0,.62);--shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px #2c2c34;color-scheme:dark}
.site{container:site/inline-size;background:var(--paper);min-height:calc(100vh - 28px);position:relative;color:var(--ink);transition:background-color 200ms}
:where(.pl) a{color:inherit}
:where(.pl) p,:where(.pl) h1,:where(.pl) h2,:where(.pl) h3,:where(.pl) ul{margin:0}
:where(.pl) h1,:where(.pl) h2,:where(.pl) h3{font-weight:inherit}
:where(.pl) ul{list-style:none;padding:0}
.pl :focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.pl button{font-family:inherit;color:inherit}
.d{font-family:var(--disp);font-weight:300;letter-spacing:-.045em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ul{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size 120ms var(--ease)}
.ul:hover{background-size:100% 1px}
.skip{position:absolute;left:24px;top:-80px;z-index:60;height:44px;padding:0 20px;display:inline-flex;align-items:center;border-radius:999px;background:var(--paper);color:var(--ink);font:600 14px/1 var(--body);text-decoration:none;box-shadow:0 0 0 1px var(--rule)}
.skip:focus{top:24px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic-s{width:16px;height:16px}

/* top bar */
.top{display:flex;align-items:center;gap:16px;height:64px;padding:0 16px 0 24px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.wm{font-family:var(--disp);font-weight:400;font-size:19px;letter-spacing:-.05em;line-height:1;text-decoration:none;display:inline-flex;align-items:center;gap:.3em;min-height:44px}
.wm-mark{width:1.2em;height:1.2em;flex:none;display:block}
.app-n{font-size:14px;font-weight:500;color:var(--t2);padding-left:14px;border-left:1px solid var(--rule);line-height:20px}
.search{position:relative;flex:1;max-width:420px;margin-left:40px}
.search .ic{position:absolute;left:14px;top:11px;color:var(--t2)}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--fb);background:var(--card);padding:0 16px 0 40px;font:500 14px/1 var(--body);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--t2)}
.search input:focus{outline:none;border-color:var(--ink);background:var(--raise)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;flex:none;border-radius:999px;display:inline-grid;place-items:center;background:none;border:0;color:var(--ink);cursor:pointer;transition:background-color 120ms}
.ib:hover{background:var(--card)}
.menu-b,.search-b{display:none}
.av{width:32px;height:32px;flex:none;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:inline-grid;place-items:center;font:400 11px/1 var(--disp);letter-spacing:-.02em}
.av-o{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-s)}
.av-l{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;text-decoration:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font:600 14px/1 var(--body);letter-spacing:.005em;text-decoration:none;white-space:nowrap;border:0;cursor:pointer;transition:background-color 120ms,box-shadow 120ms,transform 80ms,opacity 120ms}
.btn:active{transform:scale(.98)}
.pl .btn-ink{background:var(--btn);color:var(--btn-fg)}
.pl .btn-ink:hover{background:var(--btn-h)}
.pl .btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.pl .btn-line:hover{box-shadow:inset 0 0 0 1px var(--rule-s);background:var(--raise)}
.pl .btn-ghost{background:none;color:var(--ink)}
.pl .btn-ghost:hover{background:var(--card)}
.pl .btn-danger{background:none;color:var(--err);padding:0 14px}
.pl .btn-danger:hover{background:var(--err-bg)}
.btn-s{height:36px;padding:0 14px;font-size:13px;gap:6px}
.btn-w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* shell */
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 92px)}
.side{flex:0 0 264px;padding:20px 14px 28px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
.side-top{display:none}
.side>*{flex-shrink:0}
.main{flex:999 1 560px;min-width:0;padding:32px 40px 72px}
.main.solo{flex-basis:100%;padding-top:48px}
.nav-g{margin-top:22px;display:grid;gap:2px}
.nav-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--t2);padding:0 10px 4px;letter-spacing:.01em}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border-radius:10px;background:none;border:0;font:500 14px/1.2 var(--body);text-align:left;cursor:pointer;transition:background-color 120ms}
.nav-i:hover{background:var(--card)}
.nav-i.on{background:var(--card);font-weight:700}
.nav-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-c{font-size:12px;font-weight:500;color:var(--t2);font-variant-numeric:tabular-nums}
.nav-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card);flex:none}
.nav-i.on .nav-ic,.nav-i:hover .nav-ic{background:var(--paper)}
.nav-ic .ic{width:15px;height:15px}
.nav-av{width:26px;height:26px;font-size:9px}
.nav-none{padding:6px 10px;font-size:13px;color:var(--t2)}
.side-new{margin-bottom:10px}
.side-foot{margin-top:auto;padding:24px 10px 0;font-size:13px;color:var(--t2);display:grid;gap:4px}
.side-foot a{display:inline-flex;align-items:center;min-height:32px;font-weight:600;color:var(--ink)}

/* page heads */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.crumb{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px}
.h1{font-family:var(--disp);font-weight:300;letter-spacing:-.045em;font-size:clamp(30px,3cqw,42px);line-height:1.05;margin-left:-.03em}
.meta{margin-top:10px;font-size:14px;color:var(--t2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.ph-a{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.h2{font-size:15px;font-weight:700;line-height:1.3}
.sec-s{font-size:13px;color:var(--t2)}
.lead{margin-top:14px;font-size:16px;line-height:1.6;color:var(--t2);max-width:52ch}

/* tiles */
.tile{display:grid;place-items:center;background:radial-gradient(90% 80% at 50% 38%,var(--tile1) 0%,var(--tile2) 55%,var(--tile3) 100%);color:var(--tile-i);overflow:hidden}
.tile svg{width:42%;height:42%;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;display:block}

/* home */
.occ{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px}
.oc{width:100%;display:grid;gap:18px;padding:20px;border-radius:18px;background:var(--card);border:0;text-align:left;font:inherit;cursor:pointer;transition:background-color 120ms}
.oc:hover{background:var(--card-h)}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.oc-t{display:block;font-weight:700;font-size:15px;line-height:1.3}
.oc-s{display:block;font-size:13px;color:var(--t2);margin-top:2px}
.oc-d{display:flex;align-items:baseline;gap:6px}
.oc-n{font-size:40px;line-height:.9;letter-spacing:-.06em}
.oc-u{font-size:13px;color:var(--t2)}
.bar{display:block;height:6px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:inherit;background:var(--ink);transition:width 400ms var(--ease)}
.oc-b{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--t2);margin-top:-8px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:24px 16px}
.lc{display:block;width:100%;padding:0;border:0;background:none;text-align:left;font:inherit;cursor:pointer}
.mos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;border-radius:16px;overflow:hidden;aspect-ratio:4/3;transition:transform 200ms var(--ease)}
.lc:hover .mos{transform:translateY(-3px)}
.mos .tile svg{width:46%;height:46%}
.lc-t{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:15px}
.lc-s{display:block;margin-top:2px;font-size:13px;color:var(--t2)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;background:var(--card);font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap}
.tag .ic{width:13px;height:13px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}
.pc{width:100%;display:grid;gap:16px;padding:18px;border-radius:18px;background:var(--card);border:0;text-align:left;font:inherit;cursor:pointer;transition:background-color 120ms}
.pc:hover{background:var(--card-h)}
.pc-top{display:flex;align-items:center;gap:12px}
.pav{width:44px;height:44px;flex:none;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:400 13px/1 var(--disp);letter-spacing:-.02em;box-shadow:inset 0 0 0 1px var(--rule-s)}
.pc-n{display:block;font-weight:700;font-size:15px}
.pc-s{display:block;font-size:13px;color:var(--t2)}
.pc-b{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--t2);min-height:26px}
.stack{display:flex;padding-left:6px}
.stack .av{width:26px;height:26px;font-size:9px;margin-left:-6px;box-shadow:0 0 0 2px var(--card),inset 0 0 0 1px var(--rule-s)}
.ph .stack .av{box-shadow:0 0 0 2px var(--paper),inset 0 0 0 1px var(--rule-s);width:32px;height:32px;font-size:10px}
.srows{border-top:1px solid var(--rule)}
.srow{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;font:inherit;cursor:pointer}
.srow:hover .r-n{text-decoration:underline;text-underline-offset:3px}
.sr-m{flex:1;min-width:0;display:grid}
.sr-d{font-size:13px;color:var(--t2)}

/* list */
.addbar{display:flex;align-items:center;gap:8px;margin-top:28px;padding:6px 6px 6px 18px;border-radius:999px;background:var(--card);border:1px solid var(--fb);transition:box-shadow 120ms,background-color 120ms}
.addbar:focus-within{background:var(--raise);box-shadow:0 0 0 1px var(--ink),0 0 0 4px rgba(139,92,246,.3)}
.addbar>.ic{color:var(--t2)}
.addbar input{flex:1;min-width:0;height:40px;border:0;background:none;font:500 15px/1 var(--body);color:var(--ink);padding:0 4px}
.addbar input::placeholder{color:var(--t2)}
.addbar input:focus{outline:none}
.tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:24px}
.tools-r{display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:none;font:600 13px/1 var(--body);cursor:pointer;transition:background-color 120ms,border-color 120ms,color 120ms}
.chip:hover{border-color:var(--rule-s)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sel{position:relative;display:inline-flex}
.sel select{height:36px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:600 13px/1 var(--body);padding:0 34px 0 14px;-webkit-appearance:none;appearance:none;cursor:pointer}
.sel .ic{position:absolute;right:11px;top:10px;width:16px;height:16px;pointer-events:none;color:var(--t2)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--card)}
.seg button{width:40px;height:32px;border-radius:99px;border:0;background:none;color:var(--t2);display:grid;place-items:center;cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(11,11,15,.12)}
.rows{margin-top:16px;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 150px 110px 44px;grid-template-areas:"t m s p a";align-items:center;gap:18px;padding:12px 2px;border-bottom:1px solid var(--rule)}
.row>.tile{grid-area:t;width:64px;height:64px;border-radius:12px}
.r-m{grid-area:m;min-width:0}
.r-n{font-weight:700;font-size:15px;line-height:1.35}
.r-s{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:13px;color:var(--t2)}
.r-s a{color:var(--t2)}
.prio{grid-area:s;display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--t2)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.f{background:var(--ink)}
.price{grid-area:p;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-act{grid-area:a;display:flex;justify-content:flex-end}
.row.is-new,.card.is-new{animation:newin 1800ms var(--ease)}
@keyframes newin{0%{background:rgba(139,92,246,.18)}100%{background:transparent}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:28px 18px;margin-top:20px}
.card{display:flex;flex-direction:column;border-radius:18px}
.card>.tile{aspect-ratio:1;border-radius:16px;position:relative}
.card-b{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:12px}
.card .price{text-align:right}
.c-note{margin-top:4px;font-size:13px;color:var(--t2)}
.card-a{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:14px}
.card-a .btn-ink{flex:1}
.card.taken>.tile{opacity:.45}
.card.taken .r-n,.card.taken .price{color:var(--t2)}
.tile .tag{position:absolute;left:10px;top:10px;background:var(--paper);color:var(--ink)}
.fine{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:13px;color:var(--t2)}
.empty-l{margin-top:28px;padding:56px 24px;border-radius:24px;border:1px dashed var(--rule-s);display:grid;justify-items:center;text-align:center;gap:10px}
.empty-l .tile{width:96px;height:96px;border-radius:24px;margin-bottom:8px}
.empty-l p{max-width:44ch;color:var(--t2)}
.empty-l .h2{color:var(--ink);font-size:17px}

/* person */
.p-id{display:flex;align-items:center;gap:16px}
.p-id .pav{width:64px;height:64px;font-size:18px}
.pgrid{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;margin-top:8px}
.pmain{flex:999 1 480px;min-width:0}
.paside{flex:1 1 300px;max-width:100%;display:grid;gap:14px;margin-top:28px}
.box{padding:20px;border-radius:18px;background:var(--card)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.box-h .h2{font-size:14px}
.box-h .btn{margin-right:-8px}
.orow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.orow:first-of-type{border-top:0;padding-top:4px}
.orow .ic{color:var(--t2)}
.o-m{flex:1;display:grid}
.o-t{font-weight:700}
.o-s{font-size:13px;color:var(--t2)}
.o-d{font-size:13px;font-weight:600;white-space:nowrap}
.big{font-size:34px;line-height:1;letter-spacing:-.05em}
.bud{display:flex;align-items:baseline;gap:8px;margin:6px 0 14px}
.bud span:not(.big){font-size:13px;color:var(--t2)}
.bud .big{color:var(--ink)}
.bud-b{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--t2)}
.notes{display:grid;gap:8px}
.notes li{display:flex;gap:10px;font-size:14px;line-height:1.45}
.notes li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--t2);flex:none;margin-top:8px}
.box-none{font-size:13px;color:var(--t2)}
.irow{grid-template-columns:56px minmax(0,1fr) auto 190px 96px;grid-template-areas:"t m k c p"}
.irow>.tile{width:56px;height:56px}
.pick{grid-area:k;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:999px;border:1px dashed var(--rule-s);background:none;font:600 12px/1 var(--body);color:var(--t2);cursor:pointer;white-space:nowrap}
.pick .ic{width:15px;height:15px;opacity:0}
.pick:hover{border-style:solid;color:var(--ink)}
.pick.on{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--paper)}
.pick.on .ic{opacity:1}
.claim{grid-area:c;display:flex;align-items:center;gap:4px;justify-content:flex-start}
.claim .btn-ghost{padding:0 10px;color:var(--t2)}
.lockline{display:inline-flex;align-items:center;gap:6px}

/* visitor */
.vis{max-width:1120px;margin:0 auto}
.v-own{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-bottom:18px}
.v-h{font-size:clamp(40px,5cqw,72px);line-height:.98}
.v-note{display:flex;gap:12px;align-items:flex-start;margin-top:28px;padding:14px 16px;border-radius:14px;background:var(--card);font-size:14px;max-width:640px}
.v-note .ic{margin-top:1px}
.v-foot{margin-top:56px;padding-top:24px;border-top:1px solid var(--rule);font-size:13px;color:var(--t2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.v-foot a{color:var(--ink);font-weight:600}

/* empty home */
.eh{max-width:880px;padding-top:40px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;margin-top:36px}
.choice{display:grid;gap:6px;justify-items:start;padding:20px 20px 24px;border-radius:22px;border:1px solid var(--rule);background:none;text-align:left;font:inherit;cursor:pointer;transition:border-color 120ms,background-color 120ms,transform 200ms var(--ease)}
.choice:hover{border-color:var(--ink);transform:translateY(-2px)}
.choice.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice .tile{width:100%;aspect-ratio:16/9;border-radius:14px;margin-bottom:12px}
.choice .tile svg{width:22%;height:40%}

@keyframes fade{from{opacity:0}to{opacity:1}}

.f-box{position:relative}

textarea.inp{height:84px;padding:12px 14px;line-height:1.45;resize:vertical}

.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.5}
.note .ic{margin-top:1px}
.note.err{background:var(--err-bg);color:var(--err)}
.note.info{background:var(--card)}
.pv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;align-items:center;padding:12px;border-radius:18px;background:var(--card)}
.pv .tile{width:112px;height:112px;border-radius:12px}

.url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--card-h) 0%,var(--rule) 50%,var(--card-h) 100%);background-size:200% 100%;animation:sk 1.1s linear infinite}
.pv .sk.tile{width:112px;height:112px;border-radius:12px}

@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--t2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--rule);border-top-color:var(--ink);animation:spin 700ms linear infinite;flex:none}
@keyframes spin{to{transform:rotate(1turn)}}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border-radius:16px;background:var(--card)}
.sw-t{font-weight:700}
.sw-s{font-size:13px;color:var(--t2)}
.sw{position:relative;width:52px;height:32px;flex:none;border-radius:99px;border:0;background:var(--rule-s);cursor:pointer;transition:background-color 160ms}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 220ms var(--ease)}
.sw.on{background:var(--ink)}

@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
